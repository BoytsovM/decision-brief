services:
  screen:
    build: .
    ports:
      - "127.0.0.1:${DECISION_BRIEF_PORT:-8501}:8501"
    init: true
    read_only: true
    tmpfs:
      - /tmp:size=128m,mode=1777
    security_opt:
      - no-new-privileges:true
    cap_drop:
      - ALL
    environment:
      DECISION_BRIEF_MODEL: ${DECISION_BRIEF_MODEL:-}
      DECISION_BRIEF_BASE_URL: ${DECISION_BRIEF_BASE_URL:-}
      DECISION_BRIEF_API_KEY: ${DECISION_BRIEF_API_KEY:-}
      DECISION_BRIEF_COMPANIES: ${DECISION_BRIEF_COMPANIES:-}
      DECISION_BRIEF_PAYMENTS: ${DECISION_BRIEF_PAYMENTS:-}
      DECISION_BRIEF_NEWS_MODE: ${DECISION_BRIEF_NEWS_MODE:-demo}

  frontend:
    build: .
    command: ["python", "-m", "decision_brief.web_server"]
    ports:
      - "127.0.0.1:${DECISION_BRIEF_WEB_PORT:-8780}:8780"
    init: true
    read_only: true
    tmpfs:
      - /tmp:size=128m,mode=1777
    security_opt:
      - no-new-privileges:true
    cap_drop:
      - ALL
    environment:
      DECISION_BRIEF_BIND: 0.0.0.0
      DECISION_BRIEF_WEB_PORT: "8780"
      DECISION_BRIEF_MODEL: ${DECISION_BRIEF_MODEL:-}
      DECISION_BRIEF_BASE_URL: ${DECISION_BRIEF_BASE_URL:-}
      DECISION_BRIEF_API_KEY: ${DECISION_BRIEF_API_KEY:-}
      DECISION_BRIEF_COMPANIES: ${DECISION_BRIEF_COMPANIES:-}
      DECISION_BRIEF_PAYMENTS: ${DECISION_BRIEF_PAYMENTS:-}
    healthcheck:
      test: ["CMD", "python", "-c", "import urllib.request; urllib.request.urlopen('http://127.0.0.1:8780/', timeout=2)"]
      interval: 10s
      timeout: 3s
      start_period: 15s
      retries: 6
