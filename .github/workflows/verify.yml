name: Submission checks
on: [push, pull_request]
permissions:
  contents: read
jobs:
  test-and-container:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12.14'
          cache: pip
      - run: python -m pip install -r requirements.txt
      - run: python -m pip check
      - run: python -m unittest discover -s tests
        env:
          PYTHONPATH: src
      - run: docker compose config --quiet
      - run: docker compose up --build --wait --wait-timeout 120
      - run: curl --fail http://127.0.0.1:8501/_stcore/health
      - run: docker compose run --rm --no-deps screen python -m unittest discover -s tests
      - if: always()
        run: docker compose logs --no-color && docker compose down
